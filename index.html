<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Homigo Recipe Explorer — Discover delicious recipes from around the world." />
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&amp;family=Be_Vietnam_Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "fontFamily": {
                      "headline": ["Paytone One"],
                      "body": ["Be Vietnam Pro"],
                      "label": ["Be Vietnam Pro"]
              }
            },
          },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .organic-shape-1 {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        .organic-shape-2 {
            border-radius: 30% 70% 70% 30% / 50% 60% 40% 50%;
        }
        body {
            background-color: #fcf6e3;
            color: #312f23;
        }
        .editorial-shadow {
            box-shadow: 0 10px 40px rgba(49, 47, 35, 0.06);
        }
        h1, h2, h3, h4 {
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
    </style>
    <title>Homigo Recipe Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
