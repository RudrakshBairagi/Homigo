<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  nav {
    width: 100%;
    background: #fb5ed9
    ;
    color: #fff;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: bold;
  }

  .nav-links {
    display: flex;
    gap: 25px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: white;
    font-size: 1rem;
    transition: 0.3s;
  }

  .nav-links a:hover {
    color: #00c8ff;
  }

  /* Responsive Mobile Menu */
  @media(max-width: 768px) {
    .nav-links {
      display: none;
      position: absolute;
      top: 70px;
      right: 30px;
      background: #1e1e1e;
      flex-direction: column;
      padding: 15px;
      border-radius: 10px;
    }

    .nav-links.show {
      display: flex;
    }

    .menu-btn {
      cursor: pointer;
      font-size: 1.5rem;
      display: block;
    }
  }

  .menu-btn {
    display: none;
  }
</style>
</head>
<body>

<nav>
  <div class="logo">MyWebsite</div>

  <ul class="nav-links" id="navMenu">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</nav>

<script>
  function toggleMenu() {
    document.getElementById("navMenu").classList.toggle("show");
  }
</script>

</body>
</html>
